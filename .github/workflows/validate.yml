name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint skills
        run: python scripts/validate_skills.py
      - name: Test scripts
        run: python -m unittest discover -s tests -v
      - name: Check plugin manifest lists every skill
        run: |
          python - <<'PY'
          import json, pathlib, sys
          listed = {p.rstrip("/").split("/")[-1] for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["skills"]}
          actual = {p.name for p in pathlib.Path("skills").iterdir() if p.is_dir()}
          if listed != actual:
              sys.exit(f"marketplace.json out of sync. Missing: {sorted(actual - listed)}. Extra: {sorted(listed - actual)}")
          print("marketplace.json lists all skills")
          PY
